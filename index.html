<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualización de Equipos Biomédicos</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --azul: #1565c0;
    --azul-oscuro: #0d3f73;
    --azul-claro: #e8f1fc;
    --verde: #1e8e5a;
    --verde-claro: #e6f4ea;
    --ambar: #b9740a;
    --ambar-claro: #fdf1e0;
    --rojo: #d93025;
    --rojo-claro: #fde8e6;
    --gris: #f2f4f7;
    --borde: #dde1e7;
    --texto: #1c1f26;
    --texto-suave: #667085;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--gris);
    color: var(--texto);
    line-height: 1.45;
  }
  header {
    background: linear-gradient(135deg, var(--azul-oscuro), var(--azul));
    color: #fff;
    padding: 20px 20px 18px;
    text-align: center;
  }
  header .titulo { font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  header .subtitulo { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .contenedor { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }

  .paso-badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.03em;
    color: var(--azul); background: var(--azul-claro); padding: 5px 12px;
    border-radius: 999px; margin-bottom: 10px;
  }

  .tarjeta {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 1px 8px rgba(16,24,40,0.06);
  }

  .instructivo {
    font-size: 14px; color: var(--texto-suave); margin: 0 0 14px; line-height: 1.5;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; padding: 13px 8px; border: 2px solid var(--borde); border-radius: 12px;
    background: #fff; color: var(--azul); font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .tab-btn.activo { background: var(--azul); color: #fff; border-color: var(--azul); }

  #lector-camara { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 180px; }

  select, button, input {
    width: 100%; padding: 13px 14px; margin-top: 8px;
    border-radius: 12px; border: 1.5px solid var(--borde); font-size: 16px;
    font-family: inherit; color: var(--texto);
  }
  input:focus, select:focus { outline: none; border-color: var(--azul); }
  input:disabled { background: #f3f4f6; color: #9aa1ab; }

  label { font-size: 13px; font-weight: 600; color: var(--texto-suave); margin-top: 16px; display: block; }
  label:first-of-type { margin-top: 0; }

  button { cursor: pointer; font-weight: 600; transition: opacity 0.15s, transform 0.05s; }
  button:active { transform: scale(0.98); }

  .btn-primario {
    background: var(--azul); color: #fff; border: none;
    margin-top: 18px; padding: 15px; font-size: 16px; box-shadow: 0 2px 6px rgba(21,101,192,0.3);
  }
  .btn-primario:disabled { background: #b7c6da; box-shadow: none; }

  .btn-secundario {
    margin-top: 10px; background: #fff; color: var(--azul);
    border: 1.5px solid var(--azul); padding: 13px;
  }
  .btn-terciario {
    margin-top: 10px; background: #fff; color: var(--texto-suave);
    border: 1.5px solid var(--borde); padding: 13px;
  }
  .btn-registro {
    margin-top: 12px; background: var(--verde-claro); color: var(--verde);
    border: 1.5px dashed var(--verde); padding: 13px;
  }

  .estado-opciones { display: flex; gap: 8px; margin-top: 8px; }
  .estado-btn {
    flex: 1; padding: 16px 6px; border-radius: 12px; border: 2px solid var(--borde);
    background: #fff; font-weight: 700; font-size: 13px; text-align: center;
  }
  .estado-btn.op { border-color: var(--verde); color: var(--verde); }
  .estado-btn.op.sel { background: var(--verde); color: #fff; }
  .estado-btn.parcial { border-color: var(--ambar); color: var(--ambar); }
  .estado-btn.parcial.sel { background: var(--ambar); color: #fff; }
  .estado-btn.inop { border-color: var(--rojo); color: var(--rojo); }
  .estado-btn.inop.sel { background: var(--rojo); color: #fff; }

  .equipo-info {
    font-size: 14px; line-height: 1.9; background: var(--azul-claro);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 6px;
  }
  .equipo-info .titulo-equipo { display: block; font-size: 16px; font-weight: 700; color: var(--azul-oscuro); margin-bottom: 6px; }
  .equipo-info b { color: var(--azul-oscuro); }
  .equipo-info .fila-dato { color: var(--texto-suave); }
  .equipo-info .fila-dato b { color: var(--texto); font-weight: 600; }

  .oculto { display: none !important; }

  .mensaje { padding: 13px 14px; border-radius: 12px; font-size: 14px; margin-top: 12px; font-weight: 500; }
  .mensaje.error { background: var(--rojo-claro); color: var(--rojo); }
  .mensaje.exito { background: var(--verde-claro); color: var(--verde); }

  .opcional { color: #9aa1ab; font-weight: 400; }

  /* Buscador tipo combobox */
  .combo { position: relative; }
  .combo-opciones {
    position: absolute; z-index: 20; top: 100%; left: 0; right: 0; margin-top: 2px;
    background: #fff; border: 1.5px solid var(--borde);
    border-radius: 12px; max-height: 240px; overflow-y: auto;
    box-shadow: 0 6px 16px rgba(16,24,40,0.12);
  }
  .combo-opcion {
    padding: 13px 14px; font-size: 14.5px; cursor: pointer; border-bottom: 1px solid #f0f1f3;
  }
  .combo-opcion:last-child { border-bottom: none; }
  .combo-opcion:hover, .combo-opcion.activa { background: var(--azul-claro); }
  .combo-vacio { padding: 13px 14px; font-size: 14px; color: #9aa1ab; }
</style>
</head>
<body>

<header>
  <div class="titulo">🔧 Actualización de Equipos Biomédicos</div>
  <div class="subtitulo">Escanea o busca el equipo, actualiza su estado y listo</div>
</header>

<div class="contenedor">

  <!-- Paso 1: identificar el equipo -->
  <div id="paso-buscar" class="tarjeta">
    <span class="paso-badge">Paso 1 · Buscar equipo</span>
    <div class="tabs">
      <button class="tab-btn activo" id="tab-scan" onclick="cambiarTab('scan')">📷 Escanear código</button>
      <button class="tab-btn" id="tab-manual" onclick="cambiarTab('manual')">📋 Buscar manualmente</button>
    </div>

    <div id="vista-scan">
      <p class="instructivo">Apunta la cámara al código de barras de la etiqueta del equipo. Cuando lo reconozca, presiona "Capturar y buscar".</p>
      <div id="lector-camara"></div>
      <div id="codigo-en-vivo" class="mensaje oculto"></div>
      <button id="btn-capturar" class="btn-primario" onclick="capturarCodigo()" disabled>📸 Capturar y buscar</button>
      <div id="msg-scan" class="mensaje oculto"></div>
      <button id="btn-ir-registrar" class="oculto btn-registro" onclick="abrirRegistro()">➕ Registrar este equipo como nuevo</button>
    </div>

    <div id="vista-manual" class="oculto">
      <label>Sede</label>
      <div class="combo">
        <input type="text" id="input-sede" placeholder="Escribe para buscar una sede..." autocomplete="off">
        <div class="combo-opciones oculto" id="opciones-sede"></div>
      </div>

      <label>Servicio <span class="opcional">(opcional, para filtrar más)</span></label>
      <div class="combo">
        <input type="text" id="input-servicio" placeholder="Selecciona una sede primero" autocomplete="off" disabled>
        <div class="combo-opciones oculto" id="opciones-servicio"></div>
      </div>

      <label>Equipo</label>
      <div class="combo">
        <input type="text" id="input-equipo" placeholder="Selecciona una sede primero" autocomplete="off" disabled>
        <div class="combo-opciones oculto" id="opciones-equipo"></div>
      </div>
    </div>
  </div>

  <!-- Paso 2: confirmar equipo y actualizar -->
  <div id="paso-actualizar" class="tarjeta oculto">
    <span class="paso-badge">Paso 2 · Actualizar equipo</span>
    <div class="equipo-info" id="info-equipo"></div>

    <label>Sede</label>
    <input type="text" id="input-sede-editar">

    <label>Servicio</label>
    <input type="text" id="input-servicio-editar">

    <label>Marca</label>
    <input type="text" id="input-marca">

    <label>Modelo</label>
    <input type="text" id="input-modelo">

    <label>Serie</label>
    <input type="text" id="input-serie">

    <label>Estado del equipo</label>
    <div class="estado-opciones">
      <button class="estado-btn op" onclick="seleccionarEstado('OPERATIVO')">✅ Operativo</button>
      <button class="estado-btn parcial" onclick="seleccionarEstado('OPERATIVO PARCIALMENTE')">⚠️ Parcial</button>
      <button class="estado-btn inop" onclick="seleccionarEstado('INOPERATIVO')">⛔ Inoperativo</button>
    </div>

    <label>Técnico</label>
    <select id="select-tecnico" onchange="validarFormulario()">
      <option value="">— Elegir ejecutor —</option>
      <option value="ANGEL FLORES">ANGEL FLORES</option>
      <option value="JOSE ESPINOZA">JOSE ESPINOZA</option>
      <option value="ALFONSO VARGAS">ALFONSO VARGAS</option>
      <option value="JEAN MAGUIÑA">JEAN MAGUIÑA</option>
      <option value="DANNY CORREA">DANNY CORREA</option>
      <option value="JULIO VEGA">JULIO VEGA</option>
      <option value="JOSE LUIS CAMPOS">JOSE LUIS CAMPOS</option>
      <option value="KEVIN BLANCO">KEVIN BLANCO</option>
      <option value="WAGNER ROJAS">WAGNER ROJAS</option>
    </select>

    <button class="btn-primario" id="btn-guardar" onclick="guardarActualizacion()" disabled>Actualizar equipo</button>
    <button style="margin-top:8px;background:#fff;color:var(--azul);border:2px solid var(--azul);" onclick="escanearOtro()">📷 Escanear otro código</button>
    <button style="margin-top:8px;background:#fff;color:#666;" onclick="reiniciar()">Cancelar / Buscar otro equipo</button>

    <div id="msg-guardar" class="mensaje oculto"></div>
  </div>

  <!-- Paso 3: registrar equipo nuevo -->
  <div id="paso-registrar" class="tarjeta oculto">
    <h3 style="margin-top:0;">Registrar equipo nuevo</h3>

    <label>Código escaneado</label>
    <input type="text" id="reg-codigo" readonly>

    <label>Este código es...</label>
    <select id="reg-tipo-codigo">
      <option value="barras">Código de barras</option>
      <option value="patrimonial">Código patrimonial</option>
    </select>

    <label>Descripción del equipo</label>
    <input type="text" id="reg-descripcion" placeholder="Ej: OXIMETRO DE PULSOS ADULTO" oninput="validarFormularioRegistro()">

    <label>Sede</label>
    <div class="combo">
      <input type="text" id="reg-input-sede" placeholder="Escribe para buscar una sede..." autocomplete="off">
      <div class="combo-opciones oculto" id="reg-opciones-sede"></div>
    </div>

    <label>Servicio</label>
    <input type="text" id="reg-servicio" placeholder="Ej: FARMACIA">

    <label>Marca</label>
    <input type="text" id="reg-marca">

    <label>Modelo</label>
    <input type="text" id="reg-modelo">

    <label>Serie</label>
    <input type="text" id="reg-serie">

    <label>Estado inicial</label>
    <div class="estado-opciones">
      <button class="estado-btn op" onclick="seleccionarEstadoRegistro('OPERATIVO')">Operativo</button>
      <button class="estado-btn parcial" onclick="seleccionarEstadoRegistro('OPERATIVO PARCIALMENTE')">Parcial</button>
      <button class="estado-btn inop" onclick="seleccionarEstadoRegistro('INOPERATIVO')">Inoperativo</button>
    </div>

    <label>Técnico</label>
    <select id="reg-tecnico" onchange="validarFormularioRegistro()">
      <option value="">— Elegir ejecutor —</option>
      <option value="ANGEL FLORES">ANGEL FLORES</option>
      <option value="JOSE ESPINOZA">JOSE ESPINOZA</option>
      <option value="ALFONSO VARGAS">ALFONSO VARGAS</option>
      <option value="JEAN MAGUIÑA">JEAN MAGUIÑA</option>
      <option value="DANNY CORREA">DANNY CORREA</option>
      <option value="JULIO VEGA">JULIO VEGA</option>
      <option value="JOSE LUIS CAMPOS">JOSE LUIS CAMPOS</option>
      <option value="KEVIN BLANCO">KEVIN BLANCO</option>
      <option value="WAGNER ROJAS">WAGNER ROJAS</option>
    </select>

    <button class="btn-primario" id="btn-registrar" onclick="registrarEquipo()" disabled>Registrar equipo</button>
    <button style="margin-top:8px;background:#fff;color:#666;" onclick="reiniciar()">Cancelar</button>

    <div id="msg-registrar" class="mensaje oculto"></div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw7kicqcE4cwQhOKqATRItlqBhuRN9Z4lf_a6gUVk2ztUfhAMXZiW6EPuVm_30BQ-dc/exec';

let equipoActual = null;
let estadoSeleccionado = null;
let codigoParaRegistrar = '';
let estadoRegistroSeleccionado = null;

let sedesTodas = [];
let serviciosTodos = [];
let equiposTodos = []; // { descripcion, marca, serie, ...datosCompletos }

let sedeSeleccionada = '';
let servicioSeleccionado = '';

/* ---------- Tabs ---------- */
function cambiarTab(tab) {
  document.getElementById('tab-scan').classList.toggle('activo', tab === 'scan');
  document.getElementById('tab-manual').classList.toggle('activo', tab === 'manual');
  document.getElementById('vista-scan').classList.toggle('oculto', tab !== 'scan');
  document.getElementById('vista-manual').classList.toggle('oculto', tab !== 'manual');

  if (tab === 'manual' && sedesTodas.length === 0) {
    cargarSedes();
  }
  if (tab === 'scan' && !lectorIniciado) {
    iniciarEscaner();
  }
}

/* ---------- Escáner de código de barras ---------- */
let lectorIniciado = false;
let lectorInstancia = null;
let ultimoCodigoDetectado = null;

function iniciarEscaner() {
  lectorIniciado = true;
  lectorInstancia = new Html5Qrcode('lector-camara');
  lectorInstancia.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 120 } },
    (codigoDetectado) => {
      ultimoCodigoDetectado = codigoDetectado;
      const aviso = document.getElementById('codigo-en-vivo');
      aviso.textContent = `Código listo: "${codigoDetectado}" — presiona "Capturar y buscar"`;
      aviso.className = 'mensaje exito';
      document.getElementById('btn-capturar').disabled = false;
    },
    () => {}
  ).catch((err) => {
    mostrarMensaje('msg-scan', 'No se pudo acceder a la cámara: ' + err, 'error');
  });
}

function capturarCodigo() {
  if (!ultimoCodigoDetectado) return;
  const codigo = ultimoCodigoDetectado;
  document.getElementById('btn-capturar').disabled = true;
  mostrarMensaje('msg-scan', `Buscando "${codigo}"...`, 'exito');
  if (lectorInstancia) { try { lectorInstancia.pause(true); } catch (e) {} }
  buscarPorCodigo(codigo, () => {
    if (lectorInstancia) { try { lectorInstancia.resume(); } catch (e) {} }
    document.getElementById('btn-capturar').disabled = false;
  });
}

function buscarPorCodigo(codigo, alTerminar) {
  fetch(`${API_URL}?accion=buscarPorCodigo&codigo=${encodeURIComponent(codigo)}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('codigo-en-vivo').classList.add('oculto');
      ultimoCodigoDetectado = null;
      if (data.error) {
        if (data.noEncontrado) {
          mostrarMensaje('msg-scan', 'EQUIPO NO ENCONTRADO EN LA BASE DE DATOS', 'error');
          codigoParaRegistrar = codigo;
          document.getElementById('btn-ir-registrar').classList.remove('oculto');
        } else {
          mostrarMensaje('msg-scan', `Código "${codigo}" — ${data.error}`, 'error');
        }
        if (alTerminar) setTimeout(alTerminar, 500);
      } else {
        document.getElementById('btn-ir-registrar').classList.add('oculto');
        mostrarEquipo(data);
        if (alTerminar) setTimeout(alTerminar, 300);
      }
    })
    .catch(() => {
      mostrarMensaje('msg-scan', 'Error de conexión.', 'error');
      if (alTerminar) setTimeout(alTerminar, 300);
    });
}

/** Vuelve directo a la pestaña de escaneo y reanuda la cámara si estaba pausada */
function escanearOtro() {
  reiniciar();
  cambiarTab('scan');
  ultimoCodigoDetectado = null;
  document.getElementById('btn-capturar').disabled = true;
  document.getElementById('codigo-en-vivo').classList.add('oculto');
  if (lectorInstancia) {
    try { lectorInstancia.resume(); } catch (e) {}
  }
}

/* ---------- Combobox genérico (buscador con filtro) ---------- */
function configurarCombo(inputId, opcionesId, obtenerLista, obtenerEtiqueta, alSeleccionar) {
  const input = document.getElementById(inputId);
  const contenedor = document.getElementById(opcionesId);

  function render(filtro) {
    const lista = obtenerLista();
    const texto = (filtro || '').toUpperCase();
    const filtrada = texto ? lista.filter(item => obtenerEtiqueta(item).toUpperCase().includes(texto)) : lista;

    if (filtrada.length === 0) {
      contenedor.innerHTML = '<div class="combo-vacio">Sin resultados</div>';
    } else {
      contenedor.innerHTML = filtrada.slice(0, 200).map((item, i) =>
        `<div class="combo-opcion" data-i="${i}">${obtenerEtiqueta(item)}</div>`
      ).join('');
      Array.from(contenedor.children).forEach((el, i) => {
        el.addEventListener('mousedown', (e) => {
          e.preventDefault();
          input.value = obtenerEtiqueta(filtrada[i]);
          contenedor.classList.add('oculto');
          alSeleccionar(filtrada[i]);
        });
      });
    }
    contenedor.classList.remove('oculto');
  }

  input.addEventListener('input', () => render(input.value));
  input.addEventListener('focus', () => { if (!input.disabled) render(input.value); });
  input.addEventListener('blur', () => setTimeout(() => contenedor.classList.add('oculto'), 150));
}

/* ---------- Carga de datos ---------- */
function cargarSedes() {
  fetch(`${API_URL}?accion=listarSedes`)
    .then(r => r.json())
    .then(data => {
      sedesTodas = data.sedes || [];
    });
}

configurarCombo('input-sede', 'opciones-sede', () => sedesTodas, (s) => s, (sede) => {
  sedeSeleccionada = sede;
  servicioSeleccionado = '';
  document.getElementById('input-servicio').value = '';
  document.getElementById('input-servicio').disabled = false;
  document.getElementById('input-servicio').placeholder = 'Escribe para buscar un servicio...';
  document.getElementById('input-equipo').value = '';
  document.getElementById('input-equipo').disabled = true;
  document.getElementById('input-equipo').placeholder = 'Cargando equipos...';

  fetch(`${API_URL}?accion=listarDependencias&sede=${encodeURIComponent(sede)}`)
    .then(r => r.json())
    .then(data => { serviciosTodos = data.dependencias || []; });

  cargarEquipos();
});

configurarCombo('input-servicio', 'opciones-servicio', () => serviciosTodos, (s) => s, (servicio) => {
  servicioSeleccionado = servicio;
  document.getElementById('input-equipo').value = '';
  cargarEquipos();
});

// Si el usuario borra el texto del servicio a mano, vuelve a traer TODOS los equipos de la sede
document.getElementById('input-servicio').addEventListener('input', function () {
  if (this.value.trim() === '' && servicioSeleccionado !== '') {
    servicioSeleccionado = '';
    cargarEquipos();
  }
});

function cargarEquipos() {
  if (!sedeSeleccionada) return;
  const url = `${API_URL}?accion=listarEquipos&sede=${encodeURIComponent(sedeSeleccionada)}` +
    (servicioSeleccionado ? `&dependencia=${encodeURIComponent(servicioSeleccionado)}` : '');
  fetch(url)
    .then(r => r.json())
    .then(data => {
      equiposTodos = data.equipos || [];
      const inputEquipo = document.getElementById('input-equipo');
      inputEquipo.disabled = false;
      inputEquipo.placeholder = 'Escribe para buscar un equipo...';
    });
}

configurarCombo('input-equipo', 'opciones-equipo', () => equiposTodos,
  (eq) => `${eq.descripcion} - ${eq.marca || 'S/M'} (${eq.serie || 'sin serie'})`,
  (equipo) => mostrarEquipo(equipo)
);

/* ---------- Mostrar equipo y actualizar ---------- */
function mostrarEquipo(equipo) {
  equipoActual = equipo;
  document.getElementById('paso-buscar').classList.add('oculto');
  document.getElementById('paso-actualizar').classList.remove('oculto');
  const añosVigencia = parseInt((equipo.vigencia || '').toString().match(/(\d+)\s*A/i)?.[1] || '', 10);
  const vidaUtilExcedida = !isNaN(añosVigencia) && equipo.vidaUtil !== null && equipo.vidaUtil !== undefined && añosVigencia >= equipo.vidaUtil;
  const textoVidaUtil = equipo.vidaUtil !== null && equipo.vidaUtil !== undefined ? equipo.vidaUtil + ' años' : 'No encontrada en catálogo';

  document.getElementById('info-equipo').innerHTML = `
    <b>${equipo.descripcion}</b><br>
    Código Patrimonial: ${equipo.codigoPatrimonial || 'S/D'}<br>
    Código de Barras: ${equipo.codigoBarras || 'S/D'}<br>
    Sede: ${equipo.sede}<br>
    Servicio: ${equipo.dependencia}<br>
    Vigencia del equipo: ${equipo.vigencia || 'S/D'}<br>
    Vida útil: <b style="${vidaUtilExcedida ? 'color:var(--rojo);' : ''}">${textoVidaUtil}${vidaUtilExcedida ? ' — EQUIPO EN OBSOLESCENCIA' : ''}</b><br>
    Estado actual: <b>${equipo.estadoActual}</b>
  `;
  document.getElementById('input-sede-editar').value = equipo.sede || '';
  document.getElementById('input-servicio-editar').value = equipo.dependencia || '';
  document.getElementById('input-marca').value = (equipo.marca && equipo.marca !== 'SIN MARCA.') ? equipo.marca : '';
  document.getElementById('input-modelo').value = (equipo.modelo && equipo.modelo !== 'SIN MODELO') ? equipo.modelo : '';
  document.getElementById('input-serie').value = (equipo.serie && equipo.serie !== 'SIN SERIE') ? equipo.serie : '';
}

function seleccionarEstado(estado) {
  estadoSeleccionado = estado;
  document.querySelectorAll('.estado-btn').forEach(b => b.classList.remove('sel'));
  event.target.classList.add('sel');
  validarFormulario();
}

function validarFormulario() {
  const tecnico = document.getElementById('select-tecnico').value;
  document.getElementById('btn-guardar').disabled = !(estadoSeleccionado && tecnico);
}

function guardarActualizacion() {
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      fila: equipoActual.fila,
      codigoBarras: equipoActual.codigoBarras,
      codigoPatrimonial: equipoActual.codigoPatrimonial,
      estado: estadoSeleccionado,
      tecnico: document.getElementById('select-tecnico').value,
      sede: document.getElementById('input-sede-editar').value.trim(),
      servicio: document.getElementById('input-servicio-editar').value.trim(),
      marca: document.getElementById('input-marca').value.trim(),
      modelo: document.getElementById('input-modelo').value.trim(),
      serie: document.getElementById('input-serie').value.trim(),
    }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.exito) {
        mostrarMensaje('msg-guardar', '✅ Base de datos actualizada correctamente.', 'exito');
        setTimeout(reiniciar, 1800);
      } else {
        mostrarMensaje('msg-guardar', data.error || 'Error al guardar.', 'error');
        btn.disabled = false;
        btn.textContent = 'Actualizar equipo';
      }
    })
    .catch(() => {
      mostrarMensaje('msg-guardar', 'Error de conexión.', 'error');
      btn.disabled = false;
      btn.textContent = 'Actualizar equipo';
    });
}

function reiniciar() {
  equipoActual = null;
  estadoSeleccionado = null;
  codigoParaRegistrar = '';
  estadoRegistroSeleccionado = null;
  document.getElementById('select-tecnico').value = '';
  document.getElementById('input-sede-editar').value = '';
  document.getElementById('input-servicio-editar').value = '';
  document.getElementById('input-marca').value = '';
  document.getElementById('input-modelo').value = '';
  document.getElementById('input-serie').value = '';
  document.querySelectorAll('.estado-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('btn-guardar').textContent = 'Actualizar equipo';
  document.getElementById('btn-ir-registrar').classList.add('oculto');

  document.getElementById('reg-descripcion').value = '';
  document.getElementById('reg-input-sede').value = '';
  document.getElementById('reg-servicio').value = '';
  document.getElementById('reg-marca').value = '';
  document.getElementById('reg-modelo').value = '';
  document.getElementById('reg-serie').value = '';
  document.getElementById('reg-tecnico').value = '';
  document.getElementById('btn-registrar').textContent = 'Registrar equipo';
  document.getElementById('btn-registrar').disabled = true;

  document.getElementById('paso-actualizar').classList.add('oculto');
  document.getElementById('paso-registrar').classList.add('oculto');
  document.getElementById('paso-buscar').classList.remove('oculto');
}

/* ---------- Registrar equipo nuevo ---------- */
configurarCombo('reg-input-sede', 'reg-opciones-sede', () => sedesTodas, (s) => s, (sede) => {
  document.getElementById('reg-input-sede').value = sede;
});

function abrirRegistro() {
  document.getElementById('paso-buscar').classList.add('oculto');
  document.getElementById('paso-registrar').classList.remove('oculto');
  document.getElementById('reg-codigo').value = codigoParaRegistrar;
  if (sedesTodas.length === 0) cargarSedes();
}

function seleccionarEstadoRegistro(estado) {
  estadoRegistroSeleccionado = estado;
  const botones = document.querySelectorAll('#paso-registrar .estado-btn');
  botones.forEach(b => b.classList.remove('sel'));
  event.target.classList.add('sel');
  validarFormularioRegistro();
}

function validarFormularioRegistro() {
  const descripcion = document.getElementById('reg-descripcion').value.trim();
  const tecnico = document.getElementById('reg-tecnico').value;
  document.getElementById('btn-registrar').disabled = !(descripcion && tecnico);
}

function registrarEquipo() {
  const btn = document.getElementById('btn-registrar');
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  const tipoCodigo = document.getElementById('reg-tipo-codigo').value;
  const codigo = document.getElementById('reg-codigo').value.trim();

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({
      accion: 'registrar',
      codigoBarras: tipoCodigo === 'barras' ? codigo : '',
      codigoPatrimonial: tipoCodigo === 'patrimonial' ? codigo : '',
      descripcion: document.getElementById('reg-descripcion').value.trim(),
      sede: document.getElementById('reg-input-sede').value.trim(),
      servicio: document.getElementById('reg-servicio').value.trim(),
      marca: document.getElementById('reg-marca').value.trim(),
      modelo: document.getElementById('reg-modelo').value.trim(),
      serie: document.getElementById('reg-serie').value.trim(),
      estado: estadoRegistroSeleccionado || 'OPERATIVO',
      tecnico: document.getElementById('reg-tecnico').value,
    }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.exito) {
        mostrarMensaje('msg-registrar', '✅ Equipo registrado correctamente.', 'exito');
        setTimeout(reiniciar, 1800);
      } else {
        mostrarMensaje('msg-registrar', data.error || 'Error al registrar.', 'error');
        btn.disabled = false;
        btn.textContent = 'Registrar equipo';
      }
    })
    .catch(() => {
      mostrarMensaje('msg-registrar', 'Error de conexión.', 'error');
      btn.disabled = false;
      btn.textContent = 'Registrar equipo';
    });
}

function mostrarMensaje(id, texto, tipo) {
  const el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'mensaje ' + tipo;
  setTimeout(() => el.classList.add('oculto'), 4000);
}

window.addEventListener('load', () => iniciarEscaner());
</script>

</body>
</html>
